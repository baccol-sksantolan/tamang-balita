<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="admin.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.21.0/firebase-auth.js"></script>
</head>
<body>
    <div id="login-container" class="login-container">
        <h1>Admin Login</h1>
        <form id="login-form">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Login</button>
        </form>
        <p id="login-error" class="error-message"></p>
    </div>
    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyA4Etdm_Eb8b9tQcHiD9Cm7KL5FoJGeOA",
            authDomain: "balitang-tama.firebaseapp.com",
            projectId: "balitang-tama",
            storageBucket: "balitang-tama.appspot.com",
            messagingSenderId: "995757434254",
            appId: "1:995757434254:web:90a693d4c19695b8e87df",
            measurementId: "G-VXT34P3F2Y"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // Handle login form submission
        document.getElementById("login-form").addEventListener("submit", function (event) {
            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            // Firebase Authentication login
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Login successful
                    console.log("Login successful:", userCredential.user);
                    localStorage.setItem("isLoggedIn", "true");
                    window.location.href = "Admin.html"; // Redirect to Admin Dashboard
                })
                .catch((error) => {
                    // Handle login errors
                    console.error("Login error:", error);
                    document.getElementById("login-error").textContent = error.message;
                });
        });
    </script>
</body>
</html>
